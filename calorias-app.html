<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14181D">
<title>Nivel Calorías</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2314181D'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='%23FF9F43' font-family='Arial'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2314181D'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='%23FF9F43' font-family='Arial'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');
* { box-sizing: border-box; }
body { margin: 0; background: #14181D; color: #F1F3F5; font-family: 'Inter', sans-serif; }
.app { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; min-height: 100vh; }
.header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
.eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.5px; color: #FF9F43; margin-bottom: 4px; }
.title { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; margin: 0; }
.icon-btn { background: #1E242B; border: none; border-radius: 10px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
.gauge-card { background: #1E242B; border-radius: 18px; padding: 20px 18px; margin-bottom: 14px; }
.gauge-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px; }
.gauge-num { font-family: 'JetBrains Mono', monospace; font-size: 34px; font-weight: 700; line-height: 1; }
.gauge-label { font-size: 12px; color: #7C8794; margin-top: 4px; }
.bar-track { height: 10px; background: #282F38; border-radius: 6px; overflow: hidden; }
.bar-fill { height: 100%; background: linear-gradient(90deg, #FF9F43, #FFC26B); border-radius: 6px; transition: width .4s ease; }
.prot-row { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 13px; color: #9BA6B2; }
.setup-prompt { display: flex; align-items: center; gap: 10px; background: #1E242B; border-radius: 14px; padding: 16px; margin-bottom: 14px; cursor: pointer; font-size: 14px; color: #D7DCE1; }
.actions-row { display: flex; gap: 10px; margin-bottom: 20px; }
.btn-primary { flex: 1; background: #FF9F43; color: #1B1200; border: none; border-radius: 14px; padding: 13px 10px; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; }
.btn-secondary { flex: 1; background: #1E242B; color: #F1F3F5; border: 1px solid #2C333C; border-radius: 14px; padding: 13px 10px; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; }
.list-header { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.5px; color: #7C8794; margin-bottom: 10px; }
.empty { color: #7C8794; font-size: 13px; padding: 18px 4px; text-align: center; }
.entry-row { display: flex; align-items: center; gap: 10px; background: #1E242B; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
.entry-icon { width: 26px; height: 26px; border-radius: 8px; background: #282F38; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; }
.entry-name { font-size: 14px; font-weight: 500; }
.entry-meta { font-size: 11px; color: #7C8794; margin-top: 2px; }
.entry-cal { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #FFC26B; white-space: nowrap; }
.delete-btn { background: none; border: none; cursor: pointer; padding: 4px; color: #7C8794; font-size: 15px; }
.overlay { position: fixed; inset: 0; background: rgba(10,12,15,0.7); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
.overlay.hidden { display: none; }
.modal { background: #1B2027; width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 20px 18px 28px; max-height: 88vh; overflow-y: auto; box-sizing: border-box; }
.modal-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.modal-title { font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700; margin: 0; }
label.field-label { display: block; font-size: 12px; color: #9BA6B2; margin-bottom: 6px; margin-top: 12px; }
input, select { width: 100%; background: #252C34; border: 1px solid #2E3640; border-radius: 10px; padding: 11px 12px; color: #F1F3F5; font-size: 14px; box-sizing: border-box; font-family: 'Inter', sans-serif; }
.segment-row { display: flex; gap: 8px; }
.segment-btn { flex: 1; background: #252C34; border: 1px solid #2E3640; border-radius: 10px; padding: 10px; color: #9BA6B2; cursor: pointer; font-size: 13px; }
.segment-btn.active { background: #FF9F43; color: #1B1200; border-color: #FF9F43; font-weight: 600; }
.confirm-btn { width: 100%; margin-top: 18px; background: #4FD1C5; color: #062521; border: none; border-radius: 12px; padding: 13px; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; }
.preview-img { width: 100%; border-radius: 12px; margin-bottom: 12px; max-height: 220px; object-fit: cover; }
.analyzing-row { display: flex; align-items: center; gap: 10px; padding: 14px 0; color: #D7DCE1; font-size: 14px; }
.error-box { background: #2A1E1E; color: #FF9B9B; border-radius: 10px; padding: 12px; font-size: 13px; margin-top: 8px; }
.review-note { font-size: 12px; color: #7C8794; margin-bottom: 4px; }
.hint { font-size: 11.5px; color: #66707C; margin-top: 6px; line-height: 1.4; }
.spin { display: inline-block; animation: spin 1s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.center-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div>
      <div class="eyebrow">DIARIO DE HOY</div>
      <h1 class="title">Nivel calorías</h1>
    </div>
    <button class="icon-btn" id="btnSettings">⚙️</button>
  </div>

  <div id="gaugeArea"></div>

  <div class="actions-row">
    <button class="btn-primary" id="btnScan">📷 Escanear foto</button>
    <button class="btn-secondary" id="btnManual">➕ Añadir a mano</button>
  </div>
  <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">

  <div class="list-header">REGISTRO</div>
  <div id="entriesList"></div>
</div>

<!-- Modal: manual -->
<div class="overlay hidden" id="modalManual">
  <div class="modal">
    <div class="modal-header-row">
      <h2 class="modal-title">Añadir comida</h2>
      <button class="icon-btn" id="closeManual">✕</button>
    </div>
    <label class="field-label">¿Qué has comido?</label>
    <input id="manualName" placeholder="Ej: bocadillo de atún">
    <label class="field-label">Calorías</label>
    <input id="manualCal" type="number" placeholder="Ej: 450">
    <label class="field-label">Proteína (g) — opcional</label>
    <input id="manualProt" type="number" placeholder="Ej: 20">
    <button class="confirm-btn" id="submitManual">✔ Guardar</button>
  </div>
</div>

<!-- Modal: scan -->
<div class="overlay hidden" id="modalScan">
  <div class="modal">
    <div class="modal-header-row">
      <h2 class="modal-title">Escaneo de foto</h2>
      <button class="icon-btn" id="closeScan">✕</button>
    </div>
    <div id="scanBody"></div>
  </div>
</div>

<!-- Modal: settings -->
<div class="overlay hidden" id="modalSettings">
  <div class="modal">
    <div class="modal-header-row">
      <h2 class="modal-title">Tu perfil</h2>
      <button class="icon-btn" id="closeSettings">✕</button>
    </div>
    <label class="field-label">Peso (kg)</label>
    <input id="formWeight" type="number" placeholder="Ej: 55">
    <label class="field-label">Altura (cm)</label>
    <input id="formHeight" type="number" placeholder="Ej: 168">
    <label class="field-label">Edad</label>
    <input id="formAge" type="number" value="15">
    <label class="field-label">Sexo</label>
    <div class="segment-row" id="sexRow">
      <button class="segment-btn active" data-sex="chico">Chico</button>
      <button class="segment-btn" data-sex="chica">Chica</button>
    </div>
    <label class="field-label">Nivel de actividad</label>
    <select id="formActivity">
      <option value="sedentario">Sedentario (poco o ningún deporte)</option>
      <option value="ligero" selected>Ligero (deporte 1-3 días/semana)</option>
      <option value="moderado">Moderado (deporte 3-5 días/semana)</option>
      <option value="activo">Activo (deporte 6-7 días/semana)</option>
    </select>
    <label class="field-label">Extra para ganar peso (kcal/día)</label>
    <input id="formSurplus" type="number" value="400" placeholder="300-500 recomendado">
    <label class="field-label">Clave API de Gemini (para escanear fotos)</label>
    <input id="formApiKey" type="password" placeholder="Pégala aquí">
    <div class="hint">Se guarda solo en este dispositivo (en el navegador), no se envía a ningún sitio salvo directamente a Google al escanear una foto. Consíguela gratis en aistudio.google.com/apikey</div>
    <button class="confirm-btn" id="saveSettings">✔ Guardar</button>
  </div>
</div>

<script>
const ACTIVITY = {
  sedentario: { label: "Sedentario (poco o ningún deporte)", factor: 1.2 },
  ligero: { label: "Ligero (deporte 1-3 días/semana)", factor: 1.375 },
  moderado: { label: "Moderado (deporte 3-5 días/semana)", factor: 1.55 },
  activo: { label: "Activo (deporte 6-7 días/semana)", factor: 1.725 },
};

function todayKey() {
  const d = new Date();
  return `day:${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function loadJSON(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function saveJSON(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

let profile = loadJSON("profile", null);
let entries = loadJSON(todayKey(), []);
let sexChoice = profile?.sex || "chico";

function computeTarget(p) {
  if (!p) return null;
  const w = parseFloat(p.weight), h = parseFloat(p.height), a = parseFloat(p.age);
  if (!w || !h || !a) return null;
  const bmr = p.sex === "chica" ? 10*w + 6.25*h - 5*a - 161 : 10*w + 6.25*h - 5*a + 5;
  const tdee = bmr * (ACTIVITY[p.activity]?.factor || 1.375);
  return Math.round(tdee + (parseFloat(p.surplus) || 400));
}

function renderGauge() {
  const target = computeTarget(profile);
  const totalCal = entries.reduce((s,e)=>s+(e.calories||0),0);
  const totalProt = entries.reduce((s,e)=>s+(e.protein||0),0);
  const area = document.getElementById("gaugeArea");
  if (!target) {
    area.innerHTML = `<div class="setup-prompt" id="setupPrompt">📈 Configura tu perfil para ver tu objetivo diario</div>`;
    document.getElementById("setupPrompt").onclick = openSettings;
    return;
  }
  const pct = Math.min(100, Math.round((totalCal/target)*100));
  const remaining = target - totalCal;
  area.innerHTML = `
    <div class="gauge-card">
      <div class="gauge-top">
        <div>
          <div class="gauge-num">${totalCal}</div>
          <div class="gauge-label">de ${target} kcal</div>
        </div>
        <div style="text-align:right">
          <div class="gauge-num" style="font-size:22px;color:${remaining>=0?'#B7E39A':'#FF6B6B'}">${remaining>=0?'+'+remaining:remaining}</div>
          <div class="gauge-label">${remaining>=0?'te faltan':'de más'}</div>
        </div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="prot-row">🥩 ${totalProt} g de proteína hoy</div>
    </div>`;
}

function renderList() {
  const list = document.getElementById("entriesList");
  if (entries.length === 0) {
    list.innerHTML = `<div class="empty">Aún no has añadido nada hoy. Escanea una foto o añade algo a mano.</div>`;
    return;
  }
  list.innerHTML = entries.slice().reverse().map(e => `
    <div class="entry-row">
      <div class="entry-icon">${e.source==="foto"?"📷":"➕"}</div>
      <div style="flex:1">
        <div class="entry-name">${escapeHtml(e.name)}</div>
        <div class="entry-meta">${e.time} · ${e.protein||0}g proteína</div>
      </div>
      <div class="entry-cal">${e.calories} kcal</div>
      <button class="delete-btn" data-id="${e.id}">🗑</button>
    </div>
  `).join("");
  list.querySelectorAll(".delete-btn").forEach(btn => {
    btn.onclick = () => {
      entries = entries.filter(e => String(e.id) !== btn.dataset.id);
      saveJSON(todayKey(), entries);
      renderGauge(); renderList();
    };
  });
}

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

function addEntry(entry) {
  entries.push({ ...entry, id: Date.now()+Math.random(), time: new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}) });
  saveJSON(todayKey(), entries);
  renderGauge(); renderList();
}

// ---- Manual modal ----
const modalManual = document.getElementById("modalManual");
document.getElementById("btnManual").onclick = () => modalManual.classList.remove("hidden");
document.getElementById("closeManual").onclick = () => modalManual.classList.add("hidden");
document.getElementById("submitManual").onclick = () => {
  const name = document.getElementById("manualName").value.trim();
  const cal = parseFloat(document.getElementById("manualCal").value);
  const prot = parseFloat(document.getElementById("manualProt").value) || 0;
  if (!name || !cal) return;
  addEntry({ name, calories: Math.round(cal), protein: Math.round(prot), source: "manual" });
  document.getElementById("manualName").value = "";
  document.getElementById("manualCal").value = "";
  document.getElementById("manualProt").value = "";
  modalManual.classList.add("hidden");
};

// ---- Settings modal ----
const modalSettings = document.getElementById("modalSettings");
function openSettings() {
  if (profile) {
    document.getElementById("formWeight").value = profile.weight || "";
    document.getElementById("formHeight").value = profile.height || "";
    document.getElementById("formAge").value = profile.age || "15";
    document.getElementById("formActivity").value = profile.activity || "ligero";
    document.getElementById("formSurplus").value = profile.surplus || "400";
    sexChoice = profile.sex || "chico";
  }
  document.getElementById("formApiKey").value = localStorage.getItem("geminiApiKey") || "";
  updateSexButtons();
  modalSettings.classList.remove("hidden");
}
function updateSexButtons() {
  document.querySelectorAll("#sexRow .segment-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.sex === sexChoice);
  });
}
document.querySelectorAll("#sexRow .segment-btn").forEach(b => {
  b.onclick = () => { sexChoice = b.dataset.sex; updateSexButtons(); };
});
document.getElementById("btnSettings").onclick = openSettings;
document.getElementById("closeSettings").onclick = () => { if (profile) modalSettings.classList.add("hidden"); };
document.getElementById("saveSettings").onclick = () => {
  const weight = document.getElementById("formWeight").value;
  const height = document.getElementById("formHeight").value;
  const age = document.getElementById("formAge").value;
  if (!weight || !height || !age) return;
  profile = {
    weight, height, age, sex: sexChoice,
    activity: document.getElementById("formActivity").value,
    surplus: document.getElementById("formSurplus").value,
  };
  saveJSON("profile", profile);
  const apiKey = document.getElementById("formApiKey").value.trim();
  if (apiKey) localStorage.setItem("geminiApiKey", apiKey);
  modalSettings.classList.add("hidden");
  renderGauge();
};

// ---- Scan modal ----
const modalScan = document.getElementById("modalScan");
const fileInput = document.getElementById("fileInput");
document.getElementById("btnScan").onclick = () => fileInput.click();
document.getElementById("closeScan").onclick = () => { modalScan.classList.add("hidden"); fileInput.value = ""; };

fileInput.onchange = () => {
  const file = fileInput.files[0];
  if (!file) return;
  const apiKey = localStorage.getItem("geminiApiKey");
  modalScan.classList.remove("hidden");
  const reader = new FileReader();
  reader.onload = async () => {
    const dataUrl = reader.result;
    const base64 = dataUrl.split(",")[1];
    if (!apiKey) {
      document.getElementById("scanBody").innerHTML = `
        <img class="preview-img" src="${dataUrl}">
        <div class="error-box">Necesitas añadir tu clave de Gemini en Ajustes (⚙️) antes de poder escanear fotos.</div>`;
      return;
    }
    document.getElementById("scanBody").innerHTML = `
      <img class="preview-img" src="${dataUrl}">
      <div class="analyzing-row"><span class="spin">⏳</span> Analizando la foto...</div>`;
    try {
      const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [
              { inline_data: { mime_type: file.type || "image/jpeg", data: base64 } },
              { text: "Eres un nutricionista. Mira esta foto de comida y estima, para la ración visible completa: nombre del plato (en español, corto), calorías totales aproximadas, y gramos de proteína aproximados. Responde ÚNICAMENTE con un objeto JSON, sin texto adicional, sin backticks, con las claves exactas: name (string), calories (number), protein (number), confidence (\"alta\", \"media\" o \"baja\")." }
            ]
          }]
        })
      });
      const data = await resp.json();
      if (data.error) throw new Error(data.error.message || "Error de la API");
      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
      const clean = text.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(clean);
      if (!parsed.name || typeof parsed.calories !== "number") throw new Error("Respuesta incompleta");
      showScanReview(parsed, dataUrl);
    } catch (err) {
      document.getElementById("scanBody").innerHTML = `
        <img class="preview-img" src="${dataUrl}">
        <div class="error-box">No he podido analizar la foto (${escapeHtml(err.message||"error desconocido")}). Prueba otra vez o añade la comida a mano.</div>`;
    }
  };
  reader.readAsDataURL(file);
};

function showScanReview(result, dataUrl) {
  document.getElementById("scanBody").innerHTML = `
    <img class="preview-img" src="${dataUrl}">
    <div class="review-note">Estimación con confianza ${result.confidence||"media"}. Puedes ajustar los valores antes de guardar.</div>
    <label class="field-label">Nombre</label>
    <input id="scanName" value="${escapeHtml(result.name)}">
    <label class="field-label">Calorías</label>
    <input id="scanCal" type="number" value="${Math.round(result.calories)}">
    <label class="field-label">Proteína (g)</label>
    <input id="scanProt" type="number" value="${Math.round(result.protein||0)}">
    <button class="confirm-btn" id="confirmScan">✔ Añadir al diario</button>`;
  document.getElementById("confirmScan").onclick = () => {
    const name = document.getElementById("scanName").value.trim();
    const cal = parseFloat(document.getElementById("scanCal").value);
    const prot = parseFloat(document.getElementById("scanProt").value) || 0;
    if (!name || !cal) return;
    addEntry({ name, calories: Math.round(cal), protein: Math.round(prot), source: "foto" });
    modalScan.classList.add("hidden");
    fileInput.value = "";
  };
}

// ---- init ----
renderGauge();
renderList();
if (!profile) openSettings();
</script>
</body>
</html>
